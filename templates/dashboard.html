<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SMC SIFMES-400</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="logo">SMC</div>
        <div class="menu-items">
            <a href="{{ url_for('user_management') }}">Management (Users)</a>
            <a href="{{ url_for('role_management') }}">Administration (Roles)</a>
            <a href="#">Movement</a>
            <a href="#">Supervision</a>
        </div>
        <div class="user-info">
            <span>{{ session['username'] }} (Instructor)</span> | 
            <a href="{{ url_for('logout') }}" style="color: #ff6b6b;">Logout</a>
        </div>
    </div>

    <div class="container">
        {% block content %}
        <div class="welcome-box">
            <h2>Benvenuto nel sistema SIFMES-400</h2>
            <p>Seleziona una voce dal menu in alto per iniziare.</p>
        </div>
        {% endblock %}
    </div>
</body>
</html>
