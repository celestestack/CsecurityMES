{% extends 'dashboard.html' %}

{% block content %}
<div class="breadcrumb">Administration / User management</div>

<div class="action-bar">
    <button class="btn-primary">+ New user</button>
    <input type="text" placeholder="Search..." class="search-bar">
</div>

<table class="smc-table">
    <thead>
        <tr>
            <th>User ID</th>
            <th>Username</th>
            <th>Role Assigned</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.role.name if user.role else 'Nessuno' }}</td>
            <td><button class="edit-btn">✏️</button></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
