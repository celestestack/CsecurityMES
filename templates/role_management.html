{% extends 'dashboard.html' %}

{% block content %}
<div class="breadcrumb">Administration / Role management</div>

<div class="action-bar">
    <button class="btn-primary">+ New role</button>
    <input type="text" placeholder="Search..." class="search-bar">
</div>

<table class="smc-table">
    <thead>
        <tr>
            <th>Ruolo N°</th>
            <th>Description</th>
            <th>Persone assegnate</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for role in roles %}
        <tr>
            <td>{{ role.id_ruolo }}</td>
            <td class="role-desc">{{ role.descrizione }}</td>
            <td>{{ role.persone | length }}</td>
            <td><button class="edit-btn">✏️</button></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
